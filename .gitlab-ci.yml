# Build check only: the site is published from the GitHub mirror (gh/main) by
# .github/workflows/deploy.yml. This catches build errors on every branch.

variables:
  HUGO_VERSION: "0.168.0"
  # Full history: enableGitInfo takes each page's "last updated" date from its
  # last commit. A shallow clone would give every page the same date.
  GIT_DEPTH: 0

default:
  image: debian:trixie-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl git >/dev/null
    - curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C /usr/local/bin hugo
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - hugo version

build:
  stage: build
  script:
    - hugo --minify
