name: Deploy to GitHub Pages

# Publishes https://cetrafs.com on every push to main. It can also be run by
# hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel one that's already
# rolling out if another manual run is triggered mid-deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: enableGitInfo takes each page's "last updated" date
          # from its last commit. A shallow clone gives every page the same date.
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Build
        # The footer shows the commit and build time (Hugo maps HUGO_PARAMS_*
        # to site params). They are unset in local builds, so nothing shows there.
        env:
          HUGO_PARAMS_COMMIT: ${{ github.sha }}
          HUGO_PARAMS_COMMITURL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: HUGO_PARAMS_BUILDTIME="$(date -u '+%Y-%m-%d %H:%M UTC')" hugo --minify

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
