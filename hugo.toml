baseURL = "https://cetrafs.com/"
locale = "en-us"
title = "cetrafs"
theme = "cetrafs"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
# Per-page "last updated" dates (shown on doc pages, used in sitemap.xml and
# structured data) come from each file's last git commit.
enableGitInfo = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    style = "monokai"
    lineNos = false
    noClasses = true

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]

[mediaTypes."application/json"]
  suffixes = ["json"]

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[params]
  description = "cetrafs is a clustered shared-disk filesystem for Linux: many hosts mount one iSCSI or Fibre Channel LUN and run VMs from it. An open alternative to VMFS."
  author = "Massimo Cetra"
  tagline = "Clustered shared-disk filesystem for Linux"
  # The current cetrafs release. The single place to change it: templates read
  # .Site.Params.version and content pages use the {{< version >}} shortcode.
  version = "0.8"
  # The cetrafs source repository: GitHub link in the topbar (with the star
  # count once it reaches repoStarsMin), "Source" in the footer, structured data.
  repoURL = "https://github.com/cetrafs/cetrafs"
  repoStarsMin = 25
  # SPDX identifier of the cetrafs software license, used in the structured data.
  license = "GPL-2.0-or-later"

[[menu.primary]]
  name = "Docs"
  url = "/docs/"
  weight = 10
[[menu.primary]]
  name = "Tutorials"
  url = "/docs/tutorials/"
  weight = 20
[[menu.primary]]
  name = "How-to"
  url = "/docs/how-tos/"
  weight = 30
[[menu.primary]]
  name = "Concepts"
  url = "/docs/concepts/"
  weight = 40
[[menu.primary]]
  name = "Reference"
  url = "/docs/reference/"
  weight = 50
