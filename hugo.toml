baseURL = "https://cetrafs.com/"
locale = "en-us"
title = "cetrafs"
theme = "cetrafs"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
# Per-page "last updated" dates (shown on doc pages, used in sitemap.xml and
# structured data) come from each file's last git commit.
enableGitInfo = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    style = "monokai"
    lineNos = false
    noClasses = true

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]

[mediaTypes."application/json"]
  suffixes = ["json"]

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

# Google Analytics (GA4). Only production builds (`hugo`, the deploy) include
# the tag; `hugo server` doesn't. Empty the ID to remove it.
[services.googleAnalytics]
  ID = "G-H2PQ5W0BK0"

[privacy.googleAnalytics]
  respectDoNotTrack = true

[params]
  description = "cetrafs is a clustered shared-disk filesystem for Linux: many hosts mount one iSCSI or Fibre Channel LUN and run VMs from it. An open alternative to VMFS."
  author = "Massimo Cetra"
  tagline = "Clustered shared-disk filesystem for Linux"
  # The current cetrafs release. The single place to change it: templates read
  # .Site.Params.version and content pages use the {{< version >}} shortcode.
  # It is also the GitHub release tag and the Debian package version.
  version = "0.8.2"
  # The latest cetrafs-proxmox release: the GitHub release tag and the version
  # of the pve-storage-cetrafs packages. The single place to change it; content
  # pages use the {{< plugin-version >}} shortcode.
  pluginVersion = "0.3"
  pluginRepoURL = "https://github.com/cetrafs/cetrafs-proxmox"
  # The cetrafs source repository: GitHub link in the topbar (with the star
  # count once it reaches repoStarsMin), "Source" in the footer, structured data.
  repoURL = "https://github.com/cetrafs/cetrafs"
  repoStarsMin = 25
  # The cetrafs licensing terms (module GPL-2.0-or-later, tools AGPL-3.0-or-later
  # or commercial), linked from the structured data.
  license = "https://github.com/cetrafs/cetrafs/blob/main/LICENSE"

